name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: sudo xcode-select --switch /Applications/Xcode_26.4.app
      - name: Validate manifest
        run: swift package dump-package
      - name: Resolve dependencies
        run: swift package resolve
      - name: Build and test iOS consumers
        run: |
          destination=$(xcrun simctl list devices available --json | \
            jq -r '[.devices | to_entries[] | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")) | .value[] | select(.isAvailable)][0].udid // empty')
          if [[ -n "$destination" ]]; then
            xcodebuild test \
              -scheme CloudXUnityAdsAdapter \
              -destination "id=$destination" \
              CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild build-for-testing \
              -scheme CloudXUnityAdsAdapter \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO
          fi
      - name: Verify artifact checksum
        run: |
          curl --fail --location --output /tmp/CloudXUnityAdsAdapter.xcframework.zip \
            https://github.com/cloudx-io/cloudx-ios-swift-package-adapter-unityads/releases/download/binary/4200101.0.0/CloudXUnityAdsAdapter.xcframework.zip
          test "$(swift package compute-checksum /tmp/CloudXUnityAdsAdapter.xcframework.zip)" = \
            "7ac75108dc7ee7d7ee87d797384a45664c689f4e0efbedff3d9ebbbe34375774"
